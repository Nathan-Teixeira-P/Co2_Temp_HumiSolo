<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estufa do tio Valdir</title>
<style>
:root{
  --bg:#f3f6f2;--card:#fff;--fg:#17211b;--mut:#66756b;--bd:#e1e8e2;--soft:#eef3ee;
  --brand:#1f7a4d;--brand2:#2e9d68;--ok:#2f8f5b;--warn:#c98a12;--bad:#c93c3c;--info:#2a6f97;
  --okbg:#e5f4ea;--warnbg:#fbf0d9;--badbg:#fbe4e4;--shadow:0 1px 2px rgba(20,40,25,.06),0 6px 20px rgba(20,40,25,.06)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1512;--card:#182019;--fg:#e8efe9;--mut:#93a598;--bd:#26322a;--soft:#1f2b23;
  --brand:#3fbf82;--brand2:#5fd39b;--ok:#5fc08a;--warn:#e3b04b;--bad:#f07b7b;--info:#6db3d8;
  --okbg:#183324;--warnbg:#35290f;--badbg:#3a1c1c;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 48px}
header{background:linear-gradient(135deg,#14532d,#1f7a4d 55%,#2e9d68);color:#fff;padding:28px 0 64px}
header .wrap{padding-bottom:0}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
.sub{margin:2px 0 0;opacity:.85;font-size:14px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,button{font:inherit;border-radius:10px;border:1px solid transparent;padding:9px 14px}
header select,header input{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.28)}
header select option{color:#17211b}
header input::placeholder{color:rgba(255,255,255,.6)}
#go{background:#fff;color:#14532d;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#go:disabled{opacity:.6;cursor:wait}
#msg{font-size:13px;opacity:.9;min-height:20px}
main{margin-top:-40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card>h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.sec{margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.hero{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:800px){.hero{grid-template-columns:300px minmax(0,1fr)}}
.risk{text-align:center}
.risk .n{font-size:54px;font-weight:800;line-height:1;margin:6px 0 0;letter-spacing:-.03em}
.risk .n small{font-size:18px;color:var(--mut);font-weight:600}
.meter{height:10px;border-radius:99px;margin:14px 4px 6px;position:relative;background:linear-gradient(90deg,var(--ok),var(--warn) 45%,var(--bad))}
.meter i{position:absolute;top:-4px;width:4px;height:18px;border-radius:3px;background:var(--fg);transform:translateX(-2px);box-shadow:0 0 0 2px var(--card)}
.lead{font-size:16px;margin:0}
.kpi-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-h b{display:flex;align-items:center;gap:8px;font-size:15px}
.ico{width:34px;height:34px;display:grid;place-items:center;background:var(--soft);border-radius:10px;font-size:18px}
.big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:10px 0 0}
.big small{font-size:15px;color:var(--mut);font-weight:600;margin-left:4px}
svg{width:100%;height:auto;display:block;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.stats div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mut)}
.stats b{display:block;font-size:15px;color:var(--fg)}
.note{margin:10px 0 0;font-size:13px;color:var(--mut)}
ul{margin:0;padding-left:20px}li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:99px;padding:4px 12px;font-size:13px}
.chip b{margin-left:6px}
.act{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--soft);margin:6px 0}
.act span:first-child{font-size:18px}
#chatlog{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.b{max-width:85%;padding:9px 13px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.b.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.b.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.chatbar{display:flex;gap:8px;margin-top:12px}
.chatbar input{flex:1;min-width:0;background:var(--soft);color:var(--fg);border-color:var(--bd)}
.chatbar button,.sug button{background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sug button{background:var(--soft);color:var(--fg);border-color:var(--bd);font-size:13px;padding:5px 12px;font-weight:500;border-radius:99px}
details{margin-top:16px}
summary{cursor:pointer;color:var(--mut);font-weight:600;padding:8px 0}
pre{white-space:pre-wrap;margin:8px 0 0;font:12.5px/1.45 ui-monospace,monospace;background:var(--soft);padding:12px;border-radius:10px;overflow-x:auto}
.empty{text-align:center;padding:48px 16px;color:var(--mut)}
.empty .em{font-size:44px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.hi{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--soft);color:var(--fg);border:1px solid transparent;border-radius:10px;padding:8px 12px;margin:4px 0;cursor:pointer;font-size:13px}
.hi:hover{border-color:var(--brand)}
.hi.on{border-color:var(--brand);background:var(--okbg)}
.hi small{color:var(--mut)}
.trend{font-size:13px;color:var(--mut);margin:6px 0 0}
#hia .act{align-items:flex-start}
.ghost{background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
.ghost:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div><h1>🌱 Estufa do tio Valdir</h1><p class="sub">Monitoramento de CO₂, umidade do solo e temperatura com análise por IA</p></div>
    <div class="ctrl">
      <select id="fonte" aria-label="Fonte dos dados">
        <option value="demo">Demonstração (simulado)</option>
        <option value="serial">Sensor real (serial)</option>
      </select>
      <input id="porta" value="/dev/ttyACM0" aria-label="Porta serial" hidden>
      <button id="go">Analisar</button>
    </div>
  </div>
  <div id="msg" role="status"></div>
</div></header>
<div class="wrap"><main>
  <div id="out"><div class="card empty"><div class="em">🌿</div><p>Escolha a fonte dos dados e clique em <b>Analisar</b>.</p></div></div>
  <div id="hist"></div>
</main></div>
<script>
const $ = id => document.getElementById(id);
$("fonte").onchange = () => $("porta").hidden = $("fonte").value !== "serial";
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ICON = {co2: "🌫️", solo: "💧", temp: "🌡️"};
const URG = {alta: ["bad", "Urgência alta"], media: ["warn", "Urgência média"], baixa: ["ok", "Urgência baixa"]};

// Estado de um canal: media alem do limite (bad); ultima leitura alem, tendencia de risco ou sensor suspeito (warn); ou ok.
function estado(c, def) {
  const alem = def.sentido * (c.media - def.limite) >= 0;
  if (alem) return ["bad", "Fora do limite"];
  if (c.suspeito.length) return ["warn", "Sensor suspeito"];
  if (c.previsao.startsWith("ja")) return ["warn", "Passou do limite agora"];
  if (c.previsao.startsWith("cruza")) return ["warn", "Tendência de risco"];
  return ["ok", "Normal"];
}

function grafico(c, def, intervalo, id) {
  const W = 360, H = 150, m = {l: 40, r: 8, t: 10, b: 20};
  const v = c.valores, n = v.length, lim = def.limite;
  const mx = Math.max(lim, ...v), mn = Math.min(lim, ...v), pad = (mx - mn) * .12 + 1;
  const hi = mx + pad, lo = mn - pad;
  const x = i => m.l + i * (W - m.l - m.r) / (n - 1);
  const y = p => m.t + (hi - p) * (H - m.t - m.b) / (hi - lo);
  const [b, a] = c.reta;
  const linha = v.map((p, i) => `${x(i)},${y(p)}`).join(" ");
  const area = `${x(0)},${H - m.b} ${linha} ${x(n - 1)},${H - m.b}`;
  const ticks = [lo, (lo + hi) / 2, hi].map(t => `<text x="${m.l - 6}" y="${y(t) + 3}" text-anchor="end" font-size="10" fill="var(--mut)">${t.toFixed(0)}</text>
    <line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--bd)"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(def.rot)} ao longo da coleta, com limite e tendência">
    <defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--info)" stop-opacity=".28"/><stop offset="1" stop-color="var(--info)" stop-opacity="0"/></linearGradient></defs>
    ${ticks}
    <polygon points="${area}" fill="url(#g${id})"/>
    <line x1="${m.l}" x2="${W - m.r}" y1="${y(lim)}" y2="${y(lim)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W - m.r}" y="${y(lim) - 4}" text-anchor="end" font-size="10" font-weight="700" fill="var(--bad)">limite ${lim}</text>
    <line x1="${x(0)}" y1="${y(b)}" x2="${x(n - 1)}" y2="${y(a * (n - 1) + b)}" stroke="var(--mut)" stroke-width="1.5" stroke-dasharray="2 4"/>
    <polyline points="${linha}" fill="none" stroke="var(--info)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(n - 1)}" cy="${y(v[n - 1])}" r="4.5" fill="var(--info)" stroke="var(--card)" stroke-width="2"/>
    <text x="${m.l}" y="${H - 5}" font-size="10" fill="var(--mut)">0 s</text>
    <text x="${W - m.r}" y="${H - 5}" text-anchor="end" font-size="10" fill="var(--mut)">${(n - 1) * intervalo} s</text></svg>`;
}

function canalCard(k, def, c, intervalo, id) {
  const [cl, txt] = estado(c, def);
  const tend = (c.tendencia >= 0 ? "▲ +" : "▼ ") + c.tendencia.toFixed(2);
  return `<section class="card"><div class="kpi-h"><b><span class="ico" aria-hidden="true">${ICON[k]}</span>${esc(def.rot)}</b><span class="pill ${cl}">${txt}</span></div>
    <p class="big ${cl === "bad" ? "bad" : ""}">${c.media.toFixed(1)}<small>${esc(def.un)} (média)</small></p>
    ${grafico(c, def, intervalo, id)}
    <div class="stats"><div>Mínimo<b>${c.min.toFixed(1)}</b></div><div>Pico<b>${c.max.toFixed(1)}</b></div><div>Tendência/min<b>${tend}</b></div></div>
    <p class="note">🔮 ${esc(c.previsao)}</p>
    <p class="note ${c.suspeito.length ? "bad" : "ok"}">${c.suspeito.length ? "⚠️ Sensor suspeito: " + esc(c.suspeito.join(", ")) : "✅ Sensor sem anomalias"}</p></section>`;
}

let resumoAtual = "";
function render(r) {
  resumoAtual = r.resumo;
  const iaSet = Object.fromEntries((r.laudo?.setores || []).map(s => [s.nome, s]));
  const L = r.laudo;
  const blocos = r.setores.map((s, si) => {
    const ai = iaSet[s.nome];
    const rc = s.risco >= 50 ? "bad" : s.risco >= 20 ? "warn" : "ok";
    const [urgC, urgT] = ai ? (URG[ai.urgencia] || ["ok", ai.urgencia]) : ["", ""];
    const cor = Object.entries(s.correlacoes).map(([k, v]) => `<span class="chip">${esc(k)}<b>${v > 0 ? "+" : ""}${v}</b></span>`).join("");
    return `
    <div class="hero">
      <section class="card risk"><h2>Índice de risco</h2>
        <p class="n ${rc}">${s.risco}<small>/100</small></p>
        <div class="meter" role="img" aria-label="Risco ${s.risco} de 100"><i style="left:${s.risco}%"></i></div>
        ${ai ? `<span class="pill ${urgC}">${esc(urgT)}</span>` : ""}
      </section>
      <section class="card"><h2>Resumo da IA</h2>
        ${L ? `<p class="lead">${esc(L.resumo_geral)}</p>${ai ? `<p class="note">${esc(ai.diagnostico)}</p>` : ""}` : `<p class="bad">${esc(r.erro_laudo)}</p>`}
        ${(L?.insights || []).length ? `<h2 style="margin-top:14px">Insights cruzando as variáveis</h2><ul>${L.insights.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      </section>
    </div>
    <div class="grid g3 sec">${Object.entries(r.canais).map(([k, def]) => canalCard(k, def, s.canais[k], r.intervalo_s, si + k)).join("")}</div>
    <div class="grid g2 sec">
      <section class="card"><h2>Ações por regra</h2>
        ${s.regras.map(x => `<div class="act"><span aria-hidden="true">🛠️</span><span>${esc(x)}</span></div>`).join("") || `<div class="act"><span aria-hidden="true">✅</span><span>Nenhuma ação necessária</span></div>`}
        ${cor ? `<h2 style="margin-top:14px">Correlações entre variáveis</h2><div class="chips">${cor}</div>` : ""}
      </section>
      <section class="card"><h2>Ações sugeridas pela IA</h2>
        ${(ai?.acoes || []).map(x => `<div class="act"><span aria-hidden="true">🤖</span><span>${esc(x)}</span></div>`).join("") || `<p class="note">Sem sugestões (IA indisponível).</p>`}
      </section>
    </div>`;
  }).join("");

  $("out").innerHTML = blocos + `
    <section class="card sec"><h2>Pergunte à IA sobre os dados</h2>
      <div class="sug">${["Preciso irrigar agora?", "Algum sensor parece com defeito?", "O que fazer primeiro?"].map(q => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      <div id="chatlog" aria-live="polite"></div>
      <form class="chatbar" id="chatform"><input id="pergunta" placeholder="Escreva sua pergunta…" aria-label="Pergunta"><button>Enviar</button></form>
    </section>
    <details><summary>Ver análise local enviada à IA</summary><pre>${esc(r.resumo)}</pre></details>
    <details><summary>Ver painel do programa em C (CO₂)</summary><pre>${esc(r.painel)}</pre></details>`;

  const ask = async q => {
    const log = $("chatlog");
    log.insertAdjacentHTML("beforeend", `<div class="b u">${esc(q)}</div>`);
    try {
      const res = await fetch("/api/chat", {method: "POST", body: JSON.stringify({pergunta: q, resumo: resumoAtual})}), d = await res.json();
      log.insertAdjacentHTML("beforeend", `<div class="b a">${esc(d.resposta || d.erro)}</div>`);
    } catch (e) { log.insertAdjacentHTML("beforeend", `<div class="b a bad">${esc(e.message)}</div>`); }
    log.scrollTop = log.scrollHeight;
  };
  $("chatform").onsubmit = e => { e.preventDefault(); const q = $("pergunta").value.trim(); if (q) { $("pergunta").value = ""; ask(q); } };
  document.querySelectorAll(".sug button").forEach(b => b.onclick = () => ask(b.dataset.q));
}

// ---------- historico dos ultimos 10 testes ----------
function mini(vals, lim, un, cor) {
  const W = 300, H = 90, m = {l: 34, r: 8, t: 8, b: 16}, n = vals.length;
  const todos = lim == null ? vals : [...vals, lim];
  const mx = Math.max(...todos), mn = Math.min(...todos), pad = (mx - mn) * .15 + 1, hi = mx + pad, lo = mn - pad;
  const x = i => n === 1 ? (m.l + W - m.r) / 2 : m.l + i * (W - m.l - m.r) / (n - 1);
  const y = p => m.t + (hi - p) * (H - m.t - m.b) / (hi - lo);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução por teste (${esc(un)})">
    ${lim == null ? "" : `<line x1="${m.l}" x2="${W - m.r}" y1="${y(lim)}" y2="${y(lim)}" stroke="var(--bad)" stroke-dasharray="5 4"/>`}
    <text x="${m.l - 5}" y="${y(hi) + 10}" text-anchor="end" font-size="9" fill="var(--mut)">${hi.toFixed(0)}</text>
    <text x="${m.l - 5}" y="${y(lo)}" text-anchor="end" font-size="9" fill="var(--mut)">${lo.toFixed(0)}</text>
    <polyline points="${vals.map((v, i) => `${x(i)},${y(v)}`).join(" ")}" fill="none" stroke="${cor}" stroke-width="2.5" stroke-linejoin="round"/>
    ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${cor}"><title>Teste ${i + 1}: ${v.toFixed(1)} ${esc(un)}</title></circle>`).join("")}
    <text x="${m.l}" y="${H - 3}" font-size="9" fill="var(--mut)">teste 1</text>
    <text x="${W - m.r}" y="${H - 3}" text-anchor="end" font-size="9" fill="var(--mut)">teste ${n}</text></svg>`;
}

let idAtivo = null;
async function carregarHistorico() {
  let d;
  try { d = await (await fetch("/api/historico")).json(); } catch { return; }
  if (!d.itens.length) { $("hist").innerHTML = ""; return; }
  const L = d.local, lista = [...d.itens].reverse().map(e => {
    const rc = e.risco >= 50 ? "bad" : e.risco >= 20 ? "warn" : "ok";
    return `<button class="hi ${e.id === idAtivo ? "on" : ""}" data-id="${e.id}"><span>${esc(e.ts)} <small>· ${e.fonte === "serial" ? "sensor real" : "demo"}</small></span><span class="pill ${rc}">risco ${e.risco}</span></button>`;
  }).join("");
  const charts = Object.entries(d.canais).map(([k, def]) => {
    const c = L.canais[k], t = c.tendencia;
    return `<section class="card"><h2>${ICON[k]} ${esc(def.rot)} · média por teste</h2>${mini(c.medias, def.limite, def.un, "var(--info)")}
      <p class="trend">${L.n > 1 ? (t >= 0 ? "▲ +" : "▼ ") + t.toFixed(1) + " " + esc(def.un) + " por teste" : "aguardando mais testes"}${c.suspeito_em ? ` · sensor suspeito em ${c.suspeito_em}/${L.n}` : ""}</p></section>`;
  }).join("");
  $("hist").innerHTML = `<h2 style="margin:28px 0 12px;font-size:18px">📈 Histórico · últimos ${L.n} de 10 testes</h2>
    <div class="grid g2">
      <section class="card"><h2>Testes salvos (clique para reabrir)</h2>${lista}</section>
      <section class="card"><h2>Padrões calculados</h2>
        ${L.insights.map(x => `<div class="act"><span aria-hidden="true">📊</span><span>${esc(x)}</span></div>`).join("") || `<p class="note">${L.n < 2 ? "Faça ao menos 2 testes para ver a evolução." : "Sem mudanças relevantes entre os testes."}</p>`}
        <h2 style="margin-top:14px">Risco por teste</h2>${mini(L.risco.serie, null, "risco", "var(--brand)")}
        <button class="ghost" id="hbtn" ${L.n < 2 ? "disabled" : ""} style="margin-top:8px">Analisar histórico com IA</button>
        <div id="hia" style="margin-top:12px"></div>
      </section>
    </div>
    <div class="grid g3 sec">${charts}</div>`;
  document.querySelectorAll(".hi").forEach(b => b.onclick = async () => {
    const r = await (await fetch("/api/historico/" + b.dataset.id)).json();
    idAtivo = +b.dataset.id; render(r); carregarHistorico();
    $("msg").textContent = "Mostrando teste salvo de " + b.querySelector("span").textContent.trim();
    window.scrollTo({top: 0, behavior: "smooth"});
  });
  const hb = $("hbtn");
  if (hb) hb.onclick = async () => {
    hb.disabled = true; hb.textContent = "Analisando…";
    try {
      const res = await fetch("/api/historico/analise", {method: "POST", body: "{}"}), a = await res.json();
      if (!res.ok) throw new Error(a.erro);
      const A = a.analise;
      $("hia").innerHTML = `<p class="lead" style="font-size:15px">${esc(A.resumo)}</p>
        ${(A.padroes || []).map(x => `<div class="act"><span aria-hidden="true">🔎</span><span>${esc(x)}</span></div>`).join("")}
        ${(A.recomendacoes || []).map(x => `<div class="act"><span aria-hidden="true">🤖</span><span>${esc(x)}</span></div>`).join("")}`;
    } catch (e) { $("hia").innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
    hb.disabled = false; hb.textContent = "Analisar histórico com IA";
  };
}
carregarHistorico();

$("go").onclick = async () => {
  $("go").disabled = true;
  $("msg").innerHTML = `<span class="spin"></span>${$("fonte").value === "serial" ? "Coletando do sensor (~50 s)…" : "Analisando…"}`;
  try {
    const q = new URLSearchParams({fonte: $("fonte").value, porta: $("porta").value});
    const res = await fetch("/api/run?" + q, {method: "POST"}), r = await res.json();
    if (!res.ok) throw new Error(r.erro);
    idAtivo = null; render(r); carregarHistorico(); $("msg").textContent = "Atualizado às " + new Date().toLocaleTimeString();
  } catch (e) { $("msg").textContent = "Erro: " + e.message; }
  $("go").disabled = false;
};
</script>
</body>
</html>
